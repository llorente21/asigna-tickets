<div style="width: 390px; height: 844px; box-sizing: border-box; background: #221E1F; display: flex; flex-direction: column; font-family: 'Inter', sans-serif; color: #221E1F; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-family: 'Public Sans', sans-serif; font-weight: 800; font-size: 18px;">ASIGNA</span>
      <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #E0C01A;">Mis tickets</span>
    </div>
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 100px; background: #E0C01A; color: #000000; font-weight: 700; font-size: 14px;">CA</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 16px 16px 0 0; box-shadow: 0 8px 24px rgba(34,30,31,0.16);">
    <div style="display: flex; justify-content: center; padding-top: 8px;"><span style="width: 40px; height: 4px; border-radius: 100px; background: #DCD0A0;"></span></div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-family: 'Public Sans', sans-serif; font-weight: 800; font-size: 18px;">Nuevo ticket</h1>
        <span style="font-size: 12px; color: #6F675F;">Paso 1 de 2 · ¿Dónde y qué?</span>
      </div>
      <button type="button" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 11px; border: 1px solid #ECE4C8; background: #FBF6DE; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#221E1F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div style="height: 4px; margin: 0 16px; border-radius: 100px; background: #F2EEE2;"><div style="width: 50%; height: 4px; border-radius: 100px; background: #E0C01A;"></div></div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 18px 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 600;">Tu empresa</div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 11px; background: #FBF6DE; border: 1px solid #ECE4C8;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221E1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 700;">8 Logos</span>
            <span style="font-size: 12.5px; color: #4A4544;">D2 — DIX Business Center 2</span>
          </div>
        </div>
        <div style="font-size: 12px; color: #6F675F;">Viene de tu cuenta. Si el problema es en otro lugar del edificio, elige "Área común".</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 13px; font-weight: 600;">¿Dónde está el problema? <span style="color: #B71C1C;">*</span></div>
        <button type="button" aria-pressed="true" style="display: flex; gap: 12px; align-items: center; min-height: 60px; padding: 12px 14px; border-radius: 11px; border: 2px solid #E0C01A; background: #FBF6DE; font-family: 'Inter', sans-serif; color: #221E1F; text-align: left;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221E1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 21v-4h6v4M8 7h2M14 7h2M8 11h2M14 11h2"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 700;">En mi oficina</span>
            <span style="font-size: 12.5px; color: #4A4544;">Aire, luces, internet, puertas…</span>
          </span>
        </button>
        <button type="button" aria-pressed="false" style="display: flex; gap: 12px; align-items: center; min-height: 60px; padding: 12px 14px; border-radius: 11px; border: 2px solid #ECE4C8; background: #FFFFFF; font-family: 'Inter', sans-serif; color: #221E1F; text-align: left;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221E1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; font-weight: 700;">En un área común</span>
            <span style="font-size: 12.5px; color: #4A4544;">Parqueo, ascensor, baños, pasillos…</span>
          </span>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="c3-cat" style="font-size: 13px; font-weight: 600;">Categoría <span style="color: #B71C1C;">*</span></label>
        <select id="c3-cat" style="height: 48px; box-sizing: border-box; border: 1px solid #DCD0A0; border-radius: 11px; padding: 0 14px; background: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 15px; color: #221E1F;">
          <option>Aires Acondicionados</option>
          <option>Internet</option>
          <option>Luces</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="c3-sub" style="font-size: 13px; font-weight: 600;">Incidente</label>
        <select id="c3-sub" style="height: 48px; box-sizing: border-box; border: 1px solid #DCD0A0; border-radius: 11px; padding: 0 14px; background: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 15px; color: #221E1F;">
          <option>No enfría</option>
          <option>No enciende</option>
        </select>
      </div>
    </div>

    <div style="padding: 12px 16px 22px; border-top: 1px solid #ECE4C8;">
      <button type="button" style="width: 100%; height: 50px; border-radius: 11px; border: none; background: #E0C01A; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: #000000;">Continuar</button>
    </div>
  </div>
</div>
